<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4f0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:18px;font-weight:700;letter-spacing:-0.01em;">RoomFlip</p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Sign in to RoomFlip</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#57534e;">
                  Tap the button to sign in. The link works once and expires in an hour.
                </p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                     style="display:inline-block;background:#1c1917;color:#ffffff;text-decoration:none;font-size:16px;font-weight:600;padding:14px 28px;border-radius:999px;">
                    Sign in
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:15px;line-height:1.5;color:#57534e;">
                  Or type this code into the app:
                </p>
                <p style="margin:0 0 28px;font-size:30px;font-weight:700;letter-spacing:0.3em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
                  {{ .Token }}
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#a8a29e;">
                  If you didn't ask to sign in, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
